{% extends "base.html" %}{% block content %}<h1>Certificate of Registration</h1><p>{{enrollment.student}} · {{enrollment.term}}</p><table><tr><th>Version</th><th>Issued</th><th>Reason</th><th></th></tr>{% for v in versions %}<tr><td>{{v.version}}</td><td>{{v.issued_at}}</td><td>{{v.reason}}</td><td><a href="{% url 'cor_print' enrollment.pk v.version %}">View / Print</a></td></tr>{% empty %}<tr><td colspan="4">No COR has been issued.</td></tr>{% endfor %}</table>{% endblock %}
