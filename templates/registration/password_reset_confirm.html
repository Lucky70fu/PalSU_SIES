{% extends "base.html" %}{% block content %}<section class="panel narrow"><h1>Choose a new password</h1>{% if validlink %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary" type="submit">Set new password</button></form>{% else %}<p class="errorlist">This password reset link is invalid or has expired. Request a new one.</p><p><a href="{% url 'password_reset' %}">Request another reset link</a></p>{% endif %}</section>{% endblock %}
